# ==============================================================================
# POLARI RESEARCH FRAMEWORK - FULLSTACK TEST
# ==============================================================================
#
# Orchestrates frontend + backend tests together so frontend tests can make
# real API calls to the backend. Ephemeral — no persistent volumes; each run
# starts from a fresh realm import and a fresh MariaDB.
#
# USAGE:
#   docker compose -f docker-compose.fullstack-test.yml up --build --abort-on-container-exit
#
# ACCESS (only relevant if attaching to a running test container):
#   - Keycloak HTTP:   http://prf-keycloak-test:8080  (in-network only)
#   - MariaDB:         prf-mariadb-test:3306         (in-network only)
#
# Container suffixes (`-test`) prevent name collisions with dev/staging stacks.
# ==============================================================================

services:
  # MariaDB for the test Keycloak. Ephemeral — no persistent volume in test
  # mode; each suite run starts from a fresh realm import.
  prf-mariadb:
    build:
      context: ./prf-mariadb
      dockerfile: Dockerfile
    container_name: prf-mariadb-test
    image: prf-mariadb:test
    networks:
      - polari-fullstack-test-network
    env_file:
      - ./prf-mariadb/mariadb.env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

  # Keycloak in test mode — auto-imports the Polari realm at startup so
  # integration tests can hit a working OIDC endpoint.
  prf-keycloak:
    build:
      context: ./prf-keycloak
      dockerfile: Dockerfile.prf-kc
    container_name: prf-keycloak-test
    image: prf-keycloak:test
    networks:
      - polari-fullstack-test-network
    env_file:
      - ./prf-keycloak/prf-keycloak-admin.env
      # KC_DB_PASSWORD env var overrides the baked keycloak-prf.conf value.
      - ./prf-mariadb/mariadb.env
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m
      - KEYCLOAK_MODE=standalone
    depends_on:
      prf-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]
    restart: "no"

  # Backend framework tests
  polari-framework-tests:
    build:
      context: ./polari-framework
      dockerfile: Dockerfile.test
    container_name: polari-framework-tests
    networks:
      - polari-fullstack-test-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Run backend tests first
    restart: "no"

  # Backend API server for frontend integration testing
  polari-framework-server:
    build:
      context: ./polari-framework
      dockerfile: Dockerfile
    container_name: polari-framework-server
    environment:
      - DEPLOY_ENV=test
      - BACKEND_APP_PORT=8000
      - IN_DOCKER_CONTAINER=true
    networks:
      - polari-fullstack-test-network
    ports:
      - "8000:8000"
    healthcheck:
      # Use Python to check if server is responding (no curl needed)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Keep server running for frontend tests
    restart: "no"
    depends_on:
      polari-framework-tests:
        condition: service_completed_successfully

  # Frontend tests (runs after backend is ready)
  polari-frontend-tests:
    build:
      context: ./polari-platform-angular
      dockerfile: Dockerfile.test
    container_name: polari-frontend-tests
    environment:
      # Enable fullstack mode for frontend tests
      - TEST_MODE=fullstack
      - BACKEND_URL=http://polari-framework-server:8000
    networks:
      - polari-fullstack-test-network
    volumes:
      # Mount source code for development
      - ./polari-platform-angular/src:/app/src:ro
      - ./polari-platform-angular/karma.conf.js:/app/karma.conf.js:ro
      - ./polari-platform-angular/angular.json:/app/angular.json:ro
      - ./polari-platform-angular/tsconfig.json:/app/tsconfig.json:ro
      - ./polari-platform-angular/tsconfig.spec.json:/app/tsconfig.spec.json:ro
      # Mount coverage output directory
      - ./polari-platform-angular/coverage:/app/coverage
    restart: "no"
    depends_on:
      polari-framework-server:
        condition: service_healthy

networks:
  polari-fullstack-test-network:
    driver: bridge
    name: polari-fullstack-test-network
