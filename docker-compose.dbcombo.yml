# ==============================================================================
# docker-compose.dbcombo.yml — twin-B on the MariaDB + KeyDB combo
# ==============================================================================
# Overlay for docker-compose.twin-b.yml (MATERIALS_SCIENCE_MODULE_PLAN
# Track 3): instance A stays the LIGHTWEIGHT sqlite Polari; instance B
# becomes the COMBO Polari — its object DB in MariaDB (shared prf-mariadb,
# schema polari_objects_b) and the table cache in KeyDB.
#
#   POLARI_PEER_TOKEN="$(cat .generated/.polari-peer-token)" \
#   docker compose -p polari-twin-b \
#       -f docker-compose.twin-b.yml -f docker-compose.dbcombo.yml up -d
#
# Dropping the overlay (plain twin-b compose) returns B to sqlite; its
# sqlite volume is untouched either way. Credentials match prf-mariadb/
# mariadb.env + init.sh (the polari user has rights on polari_objects%).
# ==============================================================================

services:
  backend-b:
    environment:
      - DATABASE_TYPE=mariadb
      - MARIADB_HOST=prf-mariadb
      - MARIADB_PORT=3306
      - MARIADB_USER=polari
      - MARIADB_PASSWORD=polaripassword
      - MARIADB_DATABASE=polari_objects_b
      - CACHE_BACKEND=keydb
      - KEYDB_HOST=prf-b-keydb
      - KEYDB_PORT=6379
      - KEYDB_PASSWORD=polari-keydb-password
    depends_on:
      keydb-b:
        condition: service_started

  keydb-b:
    image: eqalpha/keydb:latest
    container_name: prf-b-keydb
    command: ["keydb-server", "--appendonly", "no",
              "--requirepass", "polari-keydb-password",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks:
      - polari-link
    mem_limit: 160m
