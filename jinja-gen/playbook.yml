# jinja-gen/playbook.yml — polari-rf-node's embed-jinja orchestration.
# Mirrors Isle-Mesh/embed-jinja/ansible-orchestration/ansible-playbook.yml
# (single project, so per_project is inlined). Run from the repo root:
#     ansible-playbook jinja-gen/playbook.yml
# or dockerized:  docker compose -f jinja-gen/docker-compose.setup.yml up
- name: Generate polari-rf-node docker configuration
  hosts: localhost
  connection: local

  vars_files:
    - ../setup.yml

  vars:
    current_setup_default_env: staging
    proj_root: "{{ playbook_dir | dirname }}"

  pre_tasks:
    - name: Resolve active environment name
      set_fact:
        active_env_name: >-
          {{
            (vars['current-setup'].env | default(current_setup_default_env))
            if ('current-setup' in vars) else current_setup_default_env
          }}

    - name: Resolve environment vars object (selected env)
      set_fact:
        active_env_vars: "{{ environments[active_env_name] | default({}) }}"

  tasks:
    - name: Reset "Ansible_Done" flag
      ansible.builtin.lineinfile:
        path: "{{ proj_root }}/jinja-gen/ansible-ready.env"
        regex: '^IS_ANSIBLE_DONE='
        line: 'IS_ANSIBLE_DONE=false'
        create: true
        state: present

    - name: Create jinja-templates/ and jinja-build/
      ansible.builtin.file:
        path: "{{ proj_root }}/{{ item }}"
        state: directory
      loop:
        - jinja-templates
        - jinja-build

    # Embedded-jinja sources ('# start-jinja' markers) — same detector
    # + processor as Isle-Mesh; authored .j2 files skip this stage.
    - name: Detect embedded-jinja files
      ansible.builtin.command: >
        {{ playbook_dir }}/embedded-jinja-detector.sh {{ proj_root }}
        {{ proj_root }}/jinja-build {{ proj_root }}/jinja-templates
        {{ proj_root }}/polari-framework {{ proj_root }}/polari-platform-angular
      register: detected_jinja_files
      changed_when: false
      failed_when: detected_jinja_files.rc != 0

    - name: Build list from detector output
      ansible.builtin.set_fact:
        ej_files: "{{ (detected_jinja_files.stdout | trim) | ternary((detected_jinja_files.stdout | trim).split('\n'), []) }}"

    - name: Preprocess each embedded file → jinja-templates/
      ansible.builtin.command: "{{ playbook_dir }}/embed-jinja-file-processor.sh {{ proj_root }} {{ item }}"
      loop: "{{ ej_files }}"
      register: preprocess_out
      changed_when: "'updated template:' in (preprocess_out.stdout | default(''))"
      when: ej_files | length > 0

    - name: Find .j2 templates (authored + extracted)
      ansible.builtin.find:
        paths: "{{ proj_root }}/jinja-templates"
        patterns: "*.j2"
        recurse: true
      register: templates_found

    # Promote environment dict to top-level vars (the Isle-Mesh idiom).
    - name: Promote selected environment vars to task facts
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ (active_env_vars | default({})) | dict2items | rejectattr('key','equalto','projects') | list }}"
      when: active_env_vars is defined

    - name: Ensure jinja-build destination directories exist
      ansible.builtin.file:
        path: >-
          {{
            (
              proj_root ~ '/jinja-build/' ~
              (item.path
                | replace(proj_root ~ '/jinja-templates/', '')
                | regex_replace('\.j2$', '')
              )
            ) | dirname
          }}
        state: directory
        mode: "0755"
      loop: "{{ templates_found.files }}"
      when: (templates_found.files | default([])) | length > 0

    - name: Render templates → jinja-build/
      ansible.builtin.template:
        src: "{{ item.path }}"
        dest: >-
          {{
            proj_root ~ '/jinja-build/' ~
            (item.path
              | replace(proj_root ~ '/jinja-templates/', '')
              | regex_replace('\.j2$', '')
            )
          }}
        mode: "0644"
      loop: "{{ templates_found.files }}"
      when: (templates_found.files | default([])) | length > 0

    - name: Set "Ansible Done" flag
      ansible.builtin.lineinfile:
        path: "{{ proj_root }}/jinja-gen/ansible-ready.env"
        regex: '^IS_ANSIBLE_DONE='
        line: 'IS_ANSIBLE_DONE=true'
        create: true
        state: present
