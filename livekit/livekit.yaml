# pol-livekit server config (mtg-1). NO KEYS HERE — LIVEKIT_KEYS comes from
# livekit/keys.env (generated by `pol compose livekit up`, gitignored; the
# repos are public). node_ip comes from --node-ip on the command line (the
# compose passes LIVEKIT_NODE_IP) because it is per-host, not per-config.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50049
  use_external_ip: false   # LAN-only for 2026; off-LAN = EXTERNAL_APPS + TURN,
                           # its own later step — never a side effect here
room:
  # mtg-1 posture: any valid token may create its room. mtg-2 narrows this —
  # rooms follow CollaborationSession rows and tokens are minted per-session.
  auto_create: true
logging:
  level: info
