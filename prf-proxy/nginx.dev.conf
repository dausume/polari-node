events { worker_connections 1024; }

http {
    include mime.types;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    error_log /dev/stderr debug;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upstream definitions
    # Service names must match docker-compose service names
    upstream prf-frontend {
        server frontend:4200;
    }

    upstream prf-backend {
        server backend:3000;
    }

    upstream prf-keycloak {
        server prf-keycloak:8080;
    }

    # ============================================
    # PRF DEV MODE - Cloudflare-compatible HTTPS ports
    # ============================================

    # PRF Keycloak - localhost:8443 (also exposed directly by the container
    # at 8080/8443 in dev; this provides a CA-trusted alternative).
    server {
        listen 2098 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/prf-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/prf-proxy.key;

        client_max_body_size 50M;

        location / {
            proxy_pass http://prf-keycloak;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Hardcoded `https` so KC always generates https:// URLs in its
            # admin console, mirroring pol-proxy/nginx.dev.conf — prevents
            # mixed-content blocks on the 3p-cookies iframe check.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    300s;
        }
    }

    # PRF Frontend - localhost:2087
    server {
        listen 2087 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/prf-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/prf-proxy.key;

        location / {
            proxy_pass http://prf-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Angular dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PRF Backend API - localhost:2096
    server {
        listen 2096 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/prf-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/prf-proxy.key;

        location / {
            proxy_pass http://prf-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
