# ==============================================================================
# POLARI RESEARCH FRAMEWORK - PRODUCTION
# ==============================================================================
#
# Optimized for production deployment with subdomain routing via prf-proxy,
# resource limits, and healthchecks.
#
# SETUP (run once, or when domain/config changes):
#   ./prod-setup.sh   # Generates .generated/ configs
#
# USAGE:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# ==============================================================================
# ACCESS (using your configured PROD_DOMAIN, e.g., example.com):
# ==============================================================================
#   - PRF Frontend:   https://prf.example.com
#   - PRF API:        https://api.prf.example.com
#   - Keycloak:       https://auth.prf.example.com
#   - MinIO Console:  https://files.prf.example.com
#   - MinIO S3 API:   https://s3.prf.example.com
#
# INTERNAL (docker-network only — for backend service-to-service calls):
#   - Keycloak HTTP:  http://prf-keycloak:8080  (JWKS + admin API consumed by backend)
#   - MariaDB:        prf-mariadb:3306  (Keycloak's realm store)
#
# ==============================================================================
# PORTS (external — via prf-proxy only)
# ==============================================================================
#   - HTTP:   80   (redirects to HTTPS)
#   - HTTPS:  443  (subdomain routing to all services)
#
# ==============================================================================
# MEMORY BUDGET (~2.3GB total for standalone PRF + auth substrate)
# ==============================================================================
#   - prf-backend:     384MB (Python)
#   - prf-file-store:  256MB (MinIO S3 storage)
#   - prf-frontend:     64MB (nginx static)
#   - prf-proxy:        64MB (nginx proxy)
#   - prf-keycloak:   1024MB (JVM — admin console + OIDC)
#   - prf-mariadb:     512MB (Keycloak realm store)
#   - Buffer:          ~430MB
# ==============================================================================

services:
  # ===========================================================================
  # DATABASE - MariaDB (consolidated DB for prf-keycloak + future PRF storage)
  # ===========================================================================
  prf-mariadb:
    build:
      context: ./prf-mariadb
      dockerfile: Dockerfile
    container_name: prf-mariadb
    image: prf-mariadb:prod
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./prf-mariadb/mariadb.env
      - ./.generated/.env.prod
    volumes:
      - prf-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --query-cache-size=0
      --tmp-table-size=16M
      --max-heap-table-size=16M

  # ===========================================================================
  # AUTHENTICATION - Keycloak (Polari realm, auto-scaffolded at startup)
  # ===========================================================================
  prf-keycloak:
    build:
      context: ./prf-keycloak
      dockerfile: Dockerfile.prf-kc
    container_name: prf-keycloak
    image: prf-keycloak:prod
    networks:
      - polari-node-network
    env_file:
      - ./prf-keycloak/prf-keycloak-admin.env
      - ./.generated/.env.prod
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
      - KEYCLOAK_MODE=production
    depends_on:
      prf-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.2'

  # ===========================================================================
  # PROXY - nginx subdomain routing (TLS termination)
  # ===========================================================================
  prf-proxy:
    build:
      context: ./prf-proxy
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    container_name: prf-proxy
    image: prf-proxy:prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - polari-node-network
    volumes:
      # Mount generated nginx config (from prod-setup.sh)
      - ./.generated/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      prf-keycloak:
        condition: service_started
      prf-file-store:
        condition: service_healthy
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # ===========================================================================
  # OBJECT STORAGE - MinIO S3-Compatible File Store
  # ===========================================================================
  prf-file-store:
    build:
      context: .
      dockerfile_inline: |
        FROM minio/minio:latest
        VOLUME /data
        EXPOSE 9000 9001
        CMD ["server", "/data", "--console-address", ":9001"]
    container_name: prf-file-store
    image: prf-file-store:prod
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./.generated/.env.prod
    environment:
      # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_SERVER_URL, and
      # MINIO_BROWSER_REDIRECT_URL all come from env_file (generated by prod-setup.sh)
    volumes:
      - file-store-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # FRONTEND - Angular Application (Production Build)
  # ===========================================================================
  frontend:
    build:
      context: ./polari-platform-angular
      dockerfile: Dockerfile.prod
    container_name: prf-frontend
    image: prf-frontend:prod
    restart: always
    networks:
      - polari-node-network
    volumes:
      # Mount generated runtime config for production URLs
      - ./.generated/prf-runtime-config.prod.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      - backend

  # ===========================================================================
  # BACKEND - Python/Falcon API Server
  # ===========================================================================
  backend:
    build:
      context: ./polari-framework
    container_name: prf-backend
    image: prf-backend:prod
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./.generated/.env.prod
      # Service-account secret for the polari-backend KC client (see
      # staging compose for rationale).
      - ./prf-keycloak/prf-keycloak-admin.env
    environment:
      - DEPLOY_ENV=production
      - IN_DOCKER_CONTAINER=true
      # CORS_ORIGINS and PRF_API_URL come from .env.prod file
      # API profiler self-call rewriting (avoids hairpin NAT)
      - INTERNAL_API_URL=http://localhost:3000
      # Database — SQLite enabled
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=./data/polari.db
      # Object Storage — MinIO enabled
      - OBJECT_STORAGE_ENABLED=true
      - MINIO_ENDPOINT=prf-file-store:9000
      # MINIO_ACCESS_KEY and MINIO_SECRET_KEY come from env_file
      # WebSocket (STOMP) notifications
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_PORT=3001
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 45s
      retries: 5
    volumes:
      - backend-data:/app/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'
    depends_on:
      prf-file-store:
        condition: service_healthy

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  file-store-data:
  backend-data:
  prf-mariadb-data:

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  polari-node-network:
    driver: bridge
