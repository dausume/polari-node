# ==============================================================================
# POLARI RESEARCH FRAMEWORK - STANDALONE DEVELOPMENT
# ==============================================================================
#
# Minimalist fullstack configuration with local MinIO object storage + SQLite.
# Runs PRF independently without the full Polari Suite.
#
# IMPORTANT: Choose ONE mode to run - do NOT mix:
#   - STANDALONE MODE: Run from polari-rf-node/ using THIS file
#   - SUITE MODE: Run from polari-suite/ using the parent docker-compose.yml
#
# Running both will cause container name conflicts!
#
# USAGE:
#   docker compose up -d --build
#   docker compose up -d --build backend     # Rebuild single service
#   docker compose down                      # Stop all
#
# OTHER ENVIRONMENTS:
#   Stateless (no DB, no MinIO - for parallel processing):
#       docker compose -f docker-compose.stateless.yml up -d --build
#   Staging (nip.io subdomains - closest to prod):
#       docker compose -f docker-compose.staging-nip.yml up -d --build
#   Production:
#       docker compose -f docker-compose.prod.yml up -d --build
#
# ==============================================================================
# PORTS
# ==============================================================================
#   - Frontend HTTP:   http://localhost:4201
#   - Frontend HTTPS:  http://localhost:2087 (Cloudflare-compatible)
#   - Backend HTTP:    http://localhost:3000
#   - Backend HTTPS:   http://localhost:2096 (Cloudflare-compatible)
#   - WebSocket STOMP: http://localhost:3001
#   - MinIO S3 API:    http://localhost:9000
#   - MinIO Console:   http://localhost:9001
#   - Keycloak HTTP:   http://localhost:8080   (admin console + OIDC)
#   - Keycloak HTTPS:  https://localhost:8443  (KC's own TLS listener)
#   - Keycloak (CA):   https://localhost:2098  (via prf-proxy, CA-trusted cert)
#
# INTERNAL (docker-network only — for service-to-service calls):
#   - Keycloak HTTP:   http://prf-keycloak:8080  (JWKS + admin API)
#   - MariaDB:         prf-mariadb:3306         (Keycloak realm store)
#
# ==============================================================================
# TIERED CONFIGURATION SYSTEM
# ==============================================================================
# TIER 1 (Build-time):   Values baked into images via Dockerfile
# TIER 2 (Startup-time): Environment variables below - override at 'docker-compose up'
# TIER 3 (Runtime):      Changed via UI/API while containers are running
#
# To override Tier 2 values, either:
#   1. Edit the .env file
#   2. Pass environment variables: BACKEND_URL=example.com docker-compose up
#   3. Use docker-compose.override.yml
# ==============================================================================

services:
  # ===========================================================================
  # DATABASE - MariaDB (consolidated DB for prf-keycloak + future PRF storage)
  # ===========================================================================
  prf-mariadb:
    build:
      context: ./prf-mariadb
      dockerfile: Dockerfile
    container_name: prf-mariadb
    image: prf-mariadb:dev
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./prf-mariadb/mariadb.env
    volumes:
      - prf-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50

  # ===========================================================================
  # AUTHENTICATION - Keycloak (Polari realm, auto-scaffolded at startup)
  # ===========================================================================
  prf-keycloak:
    build:
      context: ./prf-keycloak
      dockerfile: Dockerfile.prf-kc
    container_name: prf-keycloak
    image: prf-keycloak:dev
    networks:
      - polari-node-network
    ports:
      # Expose directly in dev so the Angular dev server can reach it without
      # going through prf-proxy. Production / staging routes via the proxy.
      - "8080:8080"
      - "8443:8443"
    env_file:
      - ./prf-keycloak/prf-keycloak-admin.env
      # KC_DB_PASSWORD env var overrides the baked keycloak-prf.conf value,
      # keeping Keycloak in sync with the generated DB credentials.
      - ./prf-mariadb/mariadb.env
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
      - KEYCLOAK_MODE=standalone
    depends_on:
      prf-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]

  # ===========================================================================
  # OBJECT STORAGE - MinIO S3-Compatible File Store
  # ===========================================================================
  prf-file-store:
    image: minio/minio:latest
    container_name: prf-file-store
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - polari-node-network
    environment:
      # Override knobs (export before `docker compose up`); defaults are
      # dev-grade. Keep MINIO_* client creds on the backend in sync.
      - MINIO_ROOT_USER=${POLARI_MINIO_ROOT_USER:-polari-admin}
      - MINIO_ROOT_PASSWORD=${POLARI_MINIO_ROOT_PASS:-polari-file-store-password}
    volumes:
      - file-store-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # FRONTEND - Angular Application
  # ===========================================================================
  frontend:
    build:
      context: ./polari-platform-angular
      cache_from:
        - polari-platform-angular:latest
    container_name: prf-frontend
    # Load defaults first, then .env overrides
    env_file:
      - .env.defaults
      - .env
    environment:
      # TIER 2: Startup-time overrides (can be changed without rebuild)
      # Backend connection settings
      - BACKEND_URL=${BACKEND_URL:-localhost}
      - BACKEND_HTTP_PORT=${BACKEND_HTTP_PORT:-3000}
      - BACKEND_HTTPS_PORT=${BACKEND_HTTPS_PORT:-2096}
      - BACKEND_PREFER_HTTPS=${BACKEND_PREFER_HTTPS:-false}
      # Frontend settings
      - FRONTEND_URL=${FRONTEND_URL:-localhost}
      - FRONTEND_HTTP_PORT=${FRONTEND_HTTP_PORT:-4200}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-2087}
      # SSL settings
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_CERT_PATH=/app/certs/prf-proxy.crt
      - SSL_KEY_PATH=/app/certs/prf-proxy.key
      # Connection settings (TIER 3 capable - can also change at runtime)
      - CONNECTION_RETRY_INTERVAL=${CONNECTION_RETRY_INTERVAL:-3000}
      - CONNECTION_MAX_RETRY_TIME=${CONNECTION_MAX_RETRY_TIME:-60000}
      - CONNECTION_TIMEOUT=${CONNECTION_TIMEOUT:-30000}
      # WebSocket settings
      - WEBSOCKET_URL=${BACKEND_URL:-localhost}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-3001}
    ports:
      # HTTP port (4201 to avoid conflict with PSC on 4200)
      - "${FRONTEND_HTTP_PORT:-4201}:4200"
      # HTTPS port (Cloudflare-compatible)
      - "${FRONTEND_HTTPS_PORT:-2087}:2087"
    networks:
      - polari-node-network
    depends_on:
      - backend
    volumes:
      # Persist built Angular app across rebuilds
      - frontend-dist:/project/dist
      # Persist .angular cache for faster rebuilds
      - frontend-angular-cache:/project/.angular
      # Mount SSL certificates (read-only)
      - ./prf-proxy/certs:/app/certs:ro
      # Mount runtime config for Tier 2 startup overrides
      - ./polari-platform-angular/src/assets/runtime-config.json:/project/src/assets/runtime-config.json:ro

  # ===========================================================================
  # BACKEND - Python/Falcon API Server
  # ===========================================================================
  backend:
    build:
      context: ./polari-framework
      cache_from:
        - polari-framework:latest
    container_name: prf-backend
    # Load defaults first, then .env overrides
    env_file:
      - .env.defaults
      - .env
      # Service-account secret for talking to Keycloak's admin API.
      - ./prf-keycloak/prf-keycloak-admin.env
    environment:
      # TIER 2: Startup-time overrides (can be changed without rebuild)
      # Backend server settings
      - BACKEND_URL=${BACKEND_URL:-localhost}
      - BACKEND_HTTP_PORT=${BACKEND_HTTP_PORT:-3000}
      - BACKEND_HTTPS_PORT=${BACKEND_HTTPS_PORT:-2096}
      - BACKEND_APP_PORT=${BACKEND_HTTP_PORT:-3000}
      # Frontend reference
      - FRONTEND_URL=${FRONTEND_URL:-localhost}
      - FRONTEND_HTTP_PORT=${FRONTEND_HTTP_PORT:-4200}
      # SSL settings
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_CERT_PATH=/app/certs/prf-proxy.crt
      - SSL_KEY_PATH=/app/certs/prf-proxy.key
      # Deployment environment
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - IN_DOCKER_CONTAINER=true
      # Logging (TIER 3 capable)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # CORS settings
      - CORS_ENABLED=${CORS_ENABLED:-true}
      # WebSocket (STOMP) settings
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-3001}
      # Database — SQLite enabled
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=./data/polari.db
      # Object Storage — MinIO enabled (local standalone instance)
      - OBJECT_STORAGE_ENABLED=true
      - MINIO_ENDPOINT=prf-file-store:9000
      - MINIO_ACCESS_KEY=${POLARI_MINIO_ROOT_USER:-polari-admin}
      - MINIO_SECRET_KEY=${POLARI_MINIO_ROOT_PASS:-polari-file-store-password}
    networks:
      - polari-node-network
    ports:
      # HTTP port
      - "${BACKEND_HTTP_PORT:-3000}:3000"
      # HTTPS port (Cloudflare-compatible)
      - "${BACKEND_HTTPS_PORT:-2096}:2096"
      # STOMP WebSocket
      - "${WEBSOCKET_PORT:-3001}:3001"
    volumes:
      # Persist SQLite database across container recreations
      - backend-data:/app/data
      # Persist Python cache for faster imports
      - backend-pycache:/app/__pycache__
      # Mount SSL certificates (read-only)
      - ./prf-proxy/certs:/app/certs:ro
    depends_on:
      prf-file-store:
        condition: service_healthy

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  # Object storage
  file-store-data:
    driver: local
  # Frontend
  frontend-dist:
    driver: local
  frontend-angular-cache:
    driver: local
  # Backend
  backend-data:
    driver: local
  backend-pycache:
    driver: local
  # Authentication DB
  prf-mariadb-data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  polari-node-network:
    driver: bridge
