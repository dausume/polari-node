#       - WEBSOCKET_ENABLED=true
#       - WEBSOCKET_PORT=3001
#       # Science-engine delegation (msci-engines worker on polari-link;
#       # safe when the worker is down — capability degrades honestly)
#       - MSCI_ENGINES_URL=http://${LOCAL_IP}:9500
      # dist-1: the microchip (cntfet) engines worker (:9700). UNSET =
      # the ladder (topology provider cntfet.engines, else local
      # ~/tools binaries); SET = that worker always (unreachable =
      # refusal, never a silent local fallback).
      - CNTFET_ENGINES_URL=${CNTFET_ENGINES_URL:-}
