# ==============================================================================
# POLARI RESEARCH FRAMEWORK - STAGING (nip.io subdomain routing)
# ==============================================================================
#
# Purpose: Test production builds locally with subdomain routing via prf-proxy,
# resource limits, and healthchecks. Mirrors suite-level staging pattern.
#
# SETUP (run once, or when IP changes):
#   ./staging-setup.sh   # Generates .generated/ configs
#
# USAGE:
#   docker compose -f docker-compose.staging-nip.yml up -d --build
#
#  Pruning:
#   docker compose -f docker-compose.staging-nip.yml down --volumes --remove-orphans
#
# ACCESS (using your local IP, e.g., 10.0.0.101):
#   - PRF Frontend:   https://prf.10.0.0.101.nip.io  or  https://prf.10.0.0.102.nip.io
#   - PRF API:        https://api.prf.10.0.0.101.nip.io or https://api.prf.10.0.0.102.nip.io
#   - Keycloak:       https://auth.prf.10.0.0.101.nip.io or https://auth.prf.10.0.0.102.nip.io
#   - MinIO Console:  https://files.prf.10.0.0.101.nip.io or https://files.prf.10.0.0.102.nip.io
#   - MinIO S3 API:   https://s3.prf.10.0.0.101.nip.io or https://s3.prf.prf.10.0.0.102.nip.io
#
# INTERNAL (docker-network only — for backend service-to-service calls):
#   - Keycloak HTTP:  http://prf-keycloak:8080  (JWKS + admin API consumed by backend)
#   - MariaDB:        prf-mariadb:3306  (Keycloak's realm store; PRF backend stays on its own DB)
#
# ==============================================================================
# PORTS (external — via prf-proxy only)
# ==============================================================================
#   - HTTP:   80   (redirects to HTTPS)
#   - HTTPS:  443  (subdomain routing to all services)
#
# ==============================================================================
# MEMORY BUDGET (~2.3GB total for standalone PRF + auth substrate)
# ==============================================================================
#   - prf-backend:     384MB (Python)
#   - prf-file-store:  256MB (MinIO S3 storage)
#   - prf-frontend:     64MB (nginx static)
#   - prf-proxy:        64MB (nginx proxy)
#   - prf-keycloak:   1024MB (JVM — admin console + OIDC)
#   - prf-mariadb:     512MB (Keycloak realm store)
#   - Buffer:          ~430MB
# ==============================================================================

services:
  # ===========================================================================
  # DATABASE - MariaDB (consolidated DB for prf-keycloak + future PRF storage)
  # ===========================================================================
  prf-mariadb:
    build:
      context: ./prf-mariadb
      dockerfile: Dockerfile
    container_name: prf-mariadb
    image: prf-mariadb:staging
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./prf-mariadb/mariadb.env
      - ./.generated/.env.staging
    volumes:
      - prf-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --query-cache-size=0
      --tmp-table-size=16M
      --max-heap-table-size=16M

  # ===========================================================================
  # AUTHENTICATION - Keycloak (Polari realm, auto-scaffolded at startup)
  # ===========================================================================
  prf-keycloak:
    build:
      context: ./prf-keycloak
      dockerfile: Dockerfile.prf-kc
    container_name: prf-keycloak
    image: prf-keycloak:staging
    networks:
      - polari-node-network
    env_file:
      - ./prf-keycloak/prf-keycloak-admin.env
      # KC_DB_PASSWORD env var overrides the baked keycloak-prf.conf value,
      # keeping Keycloak in sync with the generated DB credentials.
      - ./prf-mariadb/mariadb.env
      - ./.generated/.env.staging
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
      - KEYCLOAK_MODE=staging
    depends_on:
      prf-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.2'

  # ===========================================================================
  # PROXY - nginx subdomain routing (TLS termination)
  # ===========================================================================
  prf-proxy:
    build:
      context: ./prf-proxy
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    container_name: prf-proxy
    image: prf-proxy:staging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - polari-node-network
    volumes:
      # Mount generated nginx config (from staging-setup.sh)
      - ./.generated/nginx.staging.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      prf-keycloak:
        condition: service_started
      prf-file-store:
        condition: service_healthy
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # ===========================================================================
  # OBJECT STORAGE - MinIO S3-Compatible File Store
  # ===========================================================================
  prf-file-store:
    build:
      context: .
      dockerfile_inline: |
        FROM minio/minio:latest
        VOLUME /data
        EXPOSE 9000 9001
        CMD ["server", "/data", "--console-address", ":9001"]
    container_name: prf-file-store
    image: prf-file-store:staging
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./.generated/.env.staging
    environment:
      # Override knobs (export before `docker compose up`); defaults are
      # LAN-staging-grade. Keep MINIO_* client creds on backend in sync.
      - MINIO_ROOT_USER=${POLARI_MINIO_ROOT_USER:-polari-admin}
      - MINIO_ROOT_PASSWORD=${POLARI_MINIO_ROOT_PASS:-polari-file-store-password}
      # MINIO_SERVER_URL and MINIO_BROWSER_REDIRECT_URL come from env_file
      # (pre-computed with LOCAL_IP by staging-setup.sh)
    volumes:
      - file-store-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # FRONTEND - Angular Application (Production Build)
  # ===========================================================================
  frontend:
    build:
      context: ./polari-platform-angular
      dockerfile: Dockerfile.prod
    container_name: prf-frontend
    image: prf-frontend:staging
    restart: always
    networks:
      - polari-node-network
    volumes:
      # Mount generated runtime config for nip.io URLs
      - ./.generated/prf-runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      - backend

  # ===========================================================================
  # BACKEND - Python/Falcon API Server
  # ===========================================================================
  backend:
    build:
      context: ./polari-framework
    container_name: prf-backend
    image: prf-backend:staging
    restart: always
    networks:
      - polari-node-network
    env_file:
      - ./.generated/.env.staging
      # Service-account secret for the polari-backend KC client. Without
      # this the backend can't authenticate to Keycloak's admin API and
      # the Role sync silently returns empty (KeycloakClient.configured
      # short-circuits on missing secret).
      - ./prf-keycloak/prf-keycloak-admin.env
    environment:
      - DEPLOY_ENV=staging
      - IN_DOCKER_CONTAINER=true
      # API profiler self-call rewriting (avoids hairpin NAT)
      - INTERNAL_API_URL=http://localhost:3000
      # Database — SQLite enabled
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=./data/polari.db
      # Object Storage — MinIO enabled
      - OBJECT_STORAGE_ENABLED=true
      - MINIO_ENDPOINT=prf-file-store:9000
      - MINIO_ACCESS_KEY=${POLARI_MINIO_ROOT_USER:-polari-admin}
      - MINIO_SECRET_KEY=${POLARI_MINIO_ROOT_PASS:-polari-file-store-password}
      # WebSocket (STOMP) notifications
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_PORT=3001
      # Science-engine delegation (msci-engines worker on polari-link;
      # safe when the worker is down — capability degrades honestly)
      - MSCI_ENGINES_URL=http://${LOCAL_IP}:9500
      # mlb-0: per-instance module set (comma list; empty = ALL modules,
      # the monolithic default). Set at render time to focus an
      # instance — e.g. the msci set:
      #   POLARI_MODULES=materialsScience,pspp,techtree,simulations,polariapps
      # Different machines get different sets via their own render env.
      - POLARI_MODULES=${POLARI_MODULES:-}
      # mlb-1: two-phase boot (core listens fast, modules admitted
      # after listen, dependency-ordered). off = monolithic boot.
      - POLARI_LAZY_BOOT=${POLARI_LAZY_BOOT:-off}
      # mlb-5: [DB-Save] per-field stream (quiet|verbose).
      - POLARI_DB_LOG=${POLARI_DB_LOG:-quiet}
    healthcheck:
      # mlb-1: /api/health answers 200 at CORE-READY (lazy boot: ~1 min
      # even on cold volumes; urlopen raises on the 503 served during
      # the core pass, so 'starting' holds exactly until core data is
      # up). Monolithic fallback (POLARI_LAZY_BOOT=off) serves 200 only
      # after its full boot — the long grace below covers that path.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      # Grace sized for the MONOLITHIC fallback (cold seed ~10-15 min;
      # swarm KILLS tasks that outrun this). Lazy boots flip healthy at
      # core-ready long before it matters.
      start_period: 1800s
      retries: 5
    volumes:
      - backend-data:/app/data
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    depends_on:
      prf-file-store:
        condition: service_healthy

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  file-store-data:
  backend-data:
  prf-mariadb-data:

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  polari-node-network:
    driver: bridge
