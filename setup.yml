# ==============================================================================
# setup.yml — build values for the pol-build render pipeline
# ==============================================================================
# Consumed by pol-build/render.py (context for the per-service annotated
# sources under pol-services/). CREDENTIAL-FREE by policy: templates
# reference generated env files (staging-setup.sh / prod-setup.sh), never
# secret values.
#
#   pol build render          # render all ten bundles (byte-parity gated)
#   pol build promote         # push renders over the root compose files
#
# The legacy `variants:` model (compose_macros era) was retired 2026-07-08
# together with the authored .j2 templates.
# ==============================================================================

current-setup:
  env: staging

environments:
  dev:
    tier: dev
    node_image_tag: dev
    gen_env: dev
    node_network: polari-node-network
  stateless:
    tier: stateless
    node_image_tag: stateless
    gen_env: stateless
    node_network: polari-node-network
  staging:
    tier: staging
    node_image_tag: staging
    gen_env: staging
    node_network: polari-node-network
  prod:
    tier: prod
    node_image_tag: prod
    gen_env: prod
    node_network: polari-node-network
  test:
    tier: test
    node_image_tag: test
    gen_env: test
    node_network: polari-fullstack-test-network
