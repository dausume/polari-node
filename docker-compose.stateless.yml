# ==============================================================================
# POLARI RESEARCH FRAMEWORK - STATELESS (No Persistence)
# ==============================================================================
#
# Ephemeral configuration with NO database and NO object storage.
# All data lives only in the in-memory tree — nothing persists between restarts.
#
# USE CASE: Scalable parallel processing containers where remembering state
# does not matter. Each container processes independently and discards results.
#
# USAGE:
#   docker compose -f docker-compose.stateless.yml up -d --build
#   docker compose -f docker-compose.stateless.yml down
#
# ==============================================================================
# PORTS
# ==============================================================================
#   - Frontend HTTP:   localhost:4201
#   - Frontend HTTPS:  localhost:2087 (Cloudflare-compatible)
#   - Backend HTTP:    localhost:3000
#   - Backend HTTPS:   localhost:2096 (Cloudflare-compatible)
#   - WebSocket STOMP: localhost:3001
#
# ==============================================================================

services:
  # ===========================================================================
  # FRONTEND - Angular Application
  # ===========================================================================
  frontend:
    build:
      context: ./polari-platform-angular
      cache_from:
        - polari-platform-angular:latest
    container_name: prf-frontend
    env_file:
      - .env.defaults
      - .env
    environment:
      # Backend connection settings
      - BACKEND_URL=${BACKEND_URL:-localhost}
      - BACKEND_HTTP_PORT=${BACKEND_HTTP_PORT:-3000}
      - BACKEND_HTTPS_PORT=${BACKEND_HTTPS_PORT:-2096}
      - BACKEND_PREFER_HTTPS=${BACKEND_PREFER_HTTPS:-false}
      # Frontend settings
      - FRONTEND_URL=${FRONTEND_URL:-localhost}
      - FRONTEND_HTTP_PORT=${FRONTEND_HTTP_PORT:-4200}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-2087}
      # SSL settings
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_CERT_PATH=/app/certs/prf-proxy.crt
      - SSL_KEY_PATH=/app/certs/prf-proxy.key
      # Connection settings
      - CONNECTION_RETRY_INTERVAL=${CONNECTION_RETRY_INTERVAL:-3000}
      - CONNECTION_MAX_RETRY_TIME=${CONNECTION_MAX_RETRY_TIME:-60000}
      - CONNECTION_TIMEOUT=${CONNECTION_TIMEOUT:-30000}
      # WebSocket settings
      - WEBSOCKET_URL=${BACKEND_URL:-localhost}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-3001}
    ports:
      - "${FRONTEND_HTTP_PORT:-4201}:4200"
      - "${FRONTEND_HTTPS_PORT:-2087}:2087"
    networks:
      - polari-node-network
    depends_on:
      - backend
    volumes:
      # Persist build cache only (not data)
      - frontend-dist:/project/dist
      - frontend-angular-cache:/project/.angular
      # Mount SSL certificates (read-only)
      - ./prf-proxy/certs:/app/certs:ro
      # Mount runtime config
      - ./polari-platform-angular/src/assets/runtime-config.json:/project/src/assets/runtime-config.json:ro

  # ===========================================================================
  # BACKEND - Python/Falcon API Server (Stateless)
  # ===========================================================================
  backend:
    build:
      context: ./polari-framework
      cache_from:
        - polari-framework:latest
    container_name: prf-backend
    env_file:
      - .env.defaults
      - .env
    environment:
      # Backend server settings
      - BACKEND_URL=${BACKEND_URL:-localhost}
      - BACKEND_HTTP_PORT=${BACKEND_HTTP_PORT:-3000}
      - BACKEND_HTTPS_PORT=${BACKEND_HTTPS_PORT:-2096}
      - BACKEND_APP_PORT=${BACKEND_HTTP_PORT:-3000}
      # Frontend reference
      - FRONTEND_URL=${FRONTEND_URL:-localhost}
      - FRONTEND_HTTP_PORT=${FRONTEND_HTTP_PORT:-4200}
      # SSL settings
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_CERT_PATH=/app/certs/prf-proxy.crt
      - SSL_KEY_PATH=/app/certs/prf-proxy.key
      # Deployment environment
      - DEPLOY_ENV=${DEPLOY_ENV:-development}
      - IN_DOCKER_CONTAINER=true
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # CORS settings
      - CORS_ENABLED=${CORS_ENABLED:-true}
      # WebSocket (STOMP) settings
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-3001}
      # Database — DISABLED (tree-only storage)
      - DATABASE_TYPE=none
      - OBJECT_STORAGE_ENABLED=false
    networks:
      - polari-node-network
    ports:
      - "${BACKEND_HTTP_PORT:-3000}:3000"
      - "${BACKEND_HTTPS_PORT:-2096}:2096"
      - "${WEBSOCKET_PORT:-3001}:3001"
    volumes:
      # Mount SSL certificates (read-only)
      - ./prf-proxy/certs:/app/certs:ro
      # No data volumes — intentionally stateless

# ==============================================================================
# VOLUMES (build cache only — no persistent data)
# ==============================================================================
volumes:
  frontend-dist:
    driver: local
  frontend-angular-cache:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  polari-node-network:
    driver: bridge
