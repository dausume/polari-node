# ==============================================================================
# docker-compose.eda-engines.yml — the EDA engines worker (polari-eda-tools)
# ==============================================================================
# Every tool the compute ladder shells out to (riscv-gcc, yosys, iverilog,
# verilator, nextpnr/icestorm, OpenSTA, magic, netgen) behind one JSON API
# (:9800), so computelod / tensormath compute runs on whatever device the
# topology assigns while the core keeps the rows. Mirrors cnt-engines. The
# backend delegates through modules/computelod/custom/eda_engines.py —
# ladder: EDA_ENGINES_URL knob wins; else a local binary; else the local
# image; else the topology's provider (ModuleAssignment
# computelod.engines@<instance>, `pol allocate computelod.engines <inst>`);
# else an honest refusal.
#
#   (cd polari-eda-tools && ./fetch-pdk.sh)     # the PDK volume, on the device that runs the worker
#   docker compose -p eda-engines -f docker-compose.eda-engines.yml up -d --build
# ==============================================================================

networks:
  polari-link:
    external: true

services:
  eda-engines:
    build:
      context: ./polari-eda-tools
    image: prf-eda-engines:staging
    container_name: prf-eda-engines
    restart: unless-stopped
    networks:
      - polari-link
    ports:
      - "9800:9800"
    volumes:
      - ${POLARI_PDK_ROOT:-~/.cache/polari-lod/pdk}:/pdk:ro
    environment:
      - PDK_ROOT=/pdk
    mem_limit: 3000m
