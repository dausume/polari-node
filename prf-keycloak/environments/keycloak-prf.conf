# ==============================================================================
# POLARI RESEARCH FRAMEWORK - KEYCLOAK CONFIG (standalone PRF deployment)
# ==============================================================================
# This file is copied into /opt/keycloak/conf/keycloak.conf at image build time.
# NOTE Keycloak precedence: CLI args > ENV VARS (KC_*) > this conf file — so
# env_file injection in docker-compose OVERRIDES the values here.
# ==============================================================================

# Admin credentials (initial admin user creation) — left commented; the
# Keycloak container picks them up from KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
# env vars set via the env_file directive in docker-compose.
# KEYCLOAK_ADMIN=admin
# KEYCLOAK_ADMIN_PASSWORD=admin

# ==============================================================================
# DATABASE - prf-mariadb
# ==============================================================================
db=mariadb
db-url=jdbc:mariadb://prf-mariadb:3306/keycloak
db-username=kc
# db-password intentionally NOT set here (this file is baked into the public
# image). It arrives as the KC_DB_PASSWORD env var via the env_file directive
# on ./prf-mariadb/mariadb.env, which setup scripts generate.

# ==============================================================================
# HOSTNAME
# ==============================================================================
# Standalone-PRF mode is served behind prf-proxy on the auth.<host> subdomain.
# The actual hostname is supplied at runtime via the KC_HOSTNAME env var
# (e.g. auth.prf.<ip>.nip.io for staging, auth.<domain> for prod, or
# localhost:8443 for plain dev). Setting it here would force every absolute
# URL Keycloak generates onto localhost regardless of environment, which
# triggers mixed-content blocks when fronted by a TLS proxy on a real host.
hostname-strict=false
hostname-debug=true
hostname-backchannel-dynamic=false

# ==============================================================================
# HTTP/HTTPS
# ==============================================================================
http-enabled=true
http-port=8080
http-redirect-to-https=true

https-listener=secure
https-enabled=true
https-port=8443
https-certificate-file=/opt/certs/prf-kc.crt
https-certificate-key-file=/opt/certs/prf-kc.key

# ==============================================================================
# PROXY (prf-proxy fronts this; SSL terminates there)
# ==============================================================================
# `proxy=passthrough` was removed in KC 26 — use `proxy-headers=xforwarded`
# instead. Without this, KC ignores X-Forwarded-Proto/Host/Port and generates
# absolute URLs from the request's literal scheme (http on the docker
# network), causing mixed-content blocks in the admin console.
proxy-headers=xforwarded

# ==============================================================================
# MONITORING + LOGGING
# ==============================================================================
metrics-enabled=true
log-level=INFO
