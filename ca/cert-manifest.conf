# ==============================================================================
# Polari RF node (PRF) — STANDALONE cert manifest
# ==============================================================================
# A DIFFERENT cert set than the suite's ca/cert-manifest.conf: this node issues
# only its own certs — the PRF proxy (this node's TLS edge) + PRF Keycloak. No
# pol-* or psc-* certs, and no prf-backend (the backend is HTTP behind the proxy).
#
# The SAME ca/ shells consume this — only the manifest + paths/env differ. Drive
# them with:
#   MANIFEST_FILE=polari-rf-node/ca/cert-manifest.conf \
#   CA_DIR=polari-rf-node/ca  INTERNAL_CERT_DIR=polari-rf-node/ca/issued \
#   DEPLOY_ENV=staging  bash <suite>/ca/issue-internal-certs.sh
#
# Output cert-names match what prf-proxy/prf-keycloak Dockerfiles mount
# (prf-proxy.crt/key, prf-kc.crt/key); the exported root lands as prf-ca.crt.
#
# Issuer per row (no wildcards, explicit SANs):
#   step-ca   internal/self-trust (dev/staging single host -> offline signing)
#   edge      this node's PUBLIC edge — resolves to letsencrypt when the env has
#             a public edge (prod), else step-ca with the public SANs (staging).
#
# SANs use ${BASE_DOMAIN}, filled per-env from the app's own generated env
# (staging: NIP_DOMAIN=<IP>.nip.io ; prod: PROD_DOMAIN) — defined once, reused here.
# cert-name | issuer | SANs
# The proxy is the SNI terminator for EVERY prf vhost with one cert,
# so every served hostname must be a SAN here — auth/s3/files were
# missing, which strict clients (the app-shell's pinned JVM
# handshake, presigned-URL downloads) refuse as hostname mismatch.
prf-proxy | edge    | prf-proxy, prf.${BASE_DOMAIN}, api.prf.${BASE_DOMAIN}, auth.prf.${BASE_DOMAIN}, s3.prf.${BASE_DOMAIN}, files.prf.${BASE_DOMAIN}
prf-kc    | step-ca | prf-keycloak, auth.prf.${BASE_DOMAIN}
